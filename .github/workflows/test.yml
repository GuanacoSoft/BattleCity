name: Java CI

on:
  push:
    branches: 
      - main
      - develop
      - workflows
      - test-writing

  pull_request:
    branches: 
      - main
      - develop

  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build con Ant
      run: ant -noinput -buildfile build.xml

    - name: Generar reporte de tests
      run: ant test-report || echo "No se generó test-report"


    - name: Subir reporte de tests como artifact
      uses: actions/upload-artifact@v4
      with:
        name: reporte-tests
        path: build/test/report
        retention-days: 7 